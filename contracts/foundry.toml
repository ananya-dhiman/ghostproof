[profile.default]
src = "src"
out = "out"
test = "test"
script = "script"
libs = ["lib"]
solc = "0.8.24"
optimizer = true
optimizer_runs = 200

# Safety: the checker backend reuses these settings to run UNTRUSTED submitted
# tests. Keep file-system and shell cheatcodes off so a hostile submission can't
# touch the host.
ffi = false
fs_permissions = []

remappings = ["forge-std/=lib/forge-std/src/"]

[rpc_endpoints]
sepolia = "${SEPOLIA_RPC_URL}"
